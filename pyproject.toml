[project]
name = "premium-food-api"
version = "0.1.0"
description = "Four-layer limited-stock food ordering and bulletin board API"
readme = "README.md"
authors = [
    { name = "yoosangjin-stack", email = "yoosangjean@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "bcrypt>=5.0.0",
    "greenlet>=3.5.6",
    "pydantic[email]>=2.14.1",
    "pyjwt>=2.15.1",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.20",
    "asyncpg>=0.32.0",
    "fastapi[standard]>=0.162.0",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.8",
]

[tool.uv]
package = false

[dependency-groups]
dev = ["httpx>=0.28.1", "pytest>=9.2.0", "pytest-asyncio>=1.4.1.post1", "ruff>=0.17.4"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 110

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
